<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - ShadowMapViewer example </title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body {
				font-family: Monospace;
				background-color: #000;
				color: #fff;
				margin: 0px;
				overflow: hidden;
			}
			#info {
				position: absolute;
				top: 10px;
				width: 100%;
				text-align: center;
				z-index: 100;
				display:block;
			}
			#info a { color: #f00; font-weight: bold; text-decoration: underline; cursor: pointer }
		</style>
	</head>
	<body>
		
		
		<canvas id="myCanvas" style="font-family: Monospace;
				background-color: #000; color: #fff; margin: 0px; overflow: hidden;">
			
		<script src="../js/build/three.js"></script>
		<script src="../js/examples/js/controls/OrbitControls.js"></script>
		<script src="../js/examples/js/shaders/UnpackDepthRGBAShader.js"></script>
		<script src="../js/examples/js/utils/ShadowMapViewer.js"></script>
		<script src="../js/examples/js/WebGL.js"></script>
		<script src="../js/examples/js/libs/stats.min.js"></script>

		<script src="../ccapture.js-master/build/CCapture.all.min.js"></script>

		<script src="rodData_gd_centerline.js"></script>
		<script>
			var rodDataGroundTruth = {
				name: 'Ground truth',
				nNodes: nNodes,
				rodRadius: rodRadius,
				nodesRod: nodesRod.slice()
			};
		</script>
		<script src="rodData_centerline.js"></script>
		<script>
			var rodDataPredicted = {
				name: 'Predicted',
				nNodes: nNodes,
				rodRadius: rodRadius,
				nodesRod: nodesRod.slice()
			};
		</script>
		<script src="rodData_centerline_diag_baseline.js"></script>
		<script>
			var rodDataDiagBaseline = {
				name: 'Diagonal baseline',
				nNodes: nNodes,
				rodRadius: rodRadius,
				nodesRod: nodesRod.slice()
			};
		</script>


		<script>

			var camera, scene, renderer, clock, stats;
			var dirLight, spotLight;
			var cube;
			var rod, nodesRod;
			var rodGroup;
			var fixedBlock;
			var gripperGroup;
			var nNodes, nTimes, rodRadius, sphereRadius;
			var rodDataSets;
			var globalCounter = 0;
			var imgCounter = 1;
			var captureFinished = false;
			var finalFrameRecaptured = false;
			var viewCenter = new THREE.Vector3( 5, 0, 0 );
			var showRobotGripper = true;
			var showDiagBaselineRod = false;

			// Create a capturer that exports PNG images in a TAR file
			var capturer = new CCapture( { format: 'png' } );
			var canvas = document.getElementById("myCanvas");

			init();
			animate();


			function init() {

				initScene();
				initMisc();

				document.body.appendChild( renderer.domElement );
				window.addEventListener( 'resize', onWindowResize, false );


				rodDataSets = [
					{
						data: rodDataGroundTruth,
						color: 0xB7832F,
						opacity: 1.0,
						radiusScale: 1.0,
						renderOrder: 0
					},
					{
						data: rodDataPredicted,
						color: 0x1565c0,
						opacity: 0.52,
						radiusScale: 1.0,
						renderOrder: 1
					}
				];

				if ( showDiagBaselineRod ) {
					rodDataSets.push( {
						data: rodDataDiagBaseline,
						color: 0x66bb6a,
						opacity: 0.48,
						radiusScale: 1.0,
						renderOrder: 2
					} );
				}

				nNodes = Math.min.apply( null, rodDataSets.map( function ( rodStyle ) {
					return rodStyle.data.nNodes;
				} ) );
				rodRadius = Math.max.apply( null, rodDataSets.map( function ( rodStyle ) {
					return rodStyle.data.rodRadius;
				} ) );
				nTimes = Math.min.apply( null, rodDataSets.map( function ( rodStyle ) {
					var dataset = rodStyle.data;
					return Math.floor( dataset.nodesRod.length / (5 * dataset.nNodes) );
				} ) );
			}

			function initScene() {

				camera = new THREE.PerspectiveCamera( 20, window.innerWidth / window.innerHeight, 1, 1000 );
				// Change the following line to change the "boundary" of the scene (important line)	
				camera.position.set( 0, 70, 10 );

				// camera.position.set(0, 0, 50);
                camera.up = new THREE.Vector3( 0, 0, 1 );

				camera.lookAt(viewCenter);

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xffffff );

				// Lights

				spotLight = new THREE.SpotLight( 0x9090b0 );
				spotLight.name = 'Spot Light';
				spotLight.angle = 0.9;
				spotLight.penumbra = 0.5;
				// // spotLight.position.set( 40, 100, -90 );
				spotLight.position.set(50, 50, 200);
				// spotLight.position.set(0, 50, 20);
				spotLight.castShadow = true;
				spotLight.shadow.camera.near = 50;
				spotLight.shadow.camera.far = 350;
				spotLight.shadow.mapSize.width = 10240;
				spotLight.shadow.mapSize.height = 10240;
				scene.add( spotLight );

				var light = new THREE.AmbientLight( 0x808080 ); // soft white light
				scene.add( light );

				var blockGeometry = new THREE.BoxGeometry( 1.0, 1.2, 1.2 );
				var blockMaterial = new THREE.MeshPhongMaterial( {
					color: 0x808080,
					shininess: 40,
					specular: 0x222222
				} );
				fixedBlock = new THREE.Mesh( blockGeometry, blockMaterial );
				fixedBlock.position.set( -0.5, 0, 0 );
				fixedBlock.castShadow = true;
				fixedBlock.receiveShadow = true;
				scene.add( fixedBlock );

				if ( showRobotGripper ) {
					createRobotGripper();
				}

			}

			function createRobotGripper() {

				gripperGroup = new THREE.Group();

				var palmMaterial = new THREE.MeshPhongMaterial( {
					color: 0x7f1725,
					shininess: 80,
					specular: 0x333333
				} );
				var fingerMaterial = new THREE.MeshPhongMaterial( {
					color: 0x9a2432,
					shininess: 70,
					specular: 0x333333
				} );

				var palm = new THREE.Mesh( new THREE.BoxGeometry( 1.3, 1.75, 0.75 ), palmMaterial );
				palm.position.set( -0.78, 0, 0 );
				gripperGroup.add( palm );

				var upperFinger = new THREE.Mesh( new THREE.BoxGeometry( 1.15, 0.36, 0.5 ), fingerMaterial );
				upperFinger.position.set( 0.12, 0.68, 0 );
				gripperGroup.add( upperFinger );

				var lowerFinger = new THREE.Mesh( new THREE.BoxGeometry( 1.15, 0.36, 0.5 ), fingerMaterial );
				lowerFinger.position.set( 0.12, -0.68, 0 );
				gripperGroup.add( lowerFinger );

				var wrist = new THREE.Mesh( new THREE.CylinderGeometry( 0.36, 0.36, 1.55, 24 ), palmMaterial );
				wrist.rotation.z = Math.PI / 2;
				wrist.position.set( -1.95, 0, 0 );
				gripperGroup.add( wrist );

				gripperGroup.traverse( function ( child ) {
					if ( child.isMesh ) {
						child.castShadow = true;
						child.receiveShadow = true;
					}
				} );

				scene.add( gripperGroup );

			}

			function initMisc() {

				renderer = new THREE.WebGLRenderer({
							canvas: canvas, 
							antialias: true,
                    		preserveDrawingBuffer: true
                	});
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				// renderer.shadowMap.type = THREE.BasicShadowMap;
				renderer.shadowMap.type = THREE.PCFSoftShadowMap;

				// Mouse control
				var controls = new THREE.OrbitControls( camera, renderer.domElement );
				controls.target.copy( viewCenter );
				controls.update();

				clock = new THREE.Clock();

				stats = new Stats();
				document.body.appendChild( stats.dom );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );
			}

			function animate() {

				if (captureFinished) {
					return;
				}

				requestAnimationFrame( animate );

				if (globalCounter == 0)
				{
					capturer.start( canvas );
				}

				if (globalCounter < nTimes)
				{
					render();
					stats.update();
					capturer.capture( canvas );
					// console.log(globalCounter);
					// console.log(nTimes);
					// takeScreenshot(globalCounter);
					globalCounter++;
					return;
				}

				if ( !finalFrameRecaptured )
				{
					globalCounter = nTimes - 1;
					render();
					stats.update();
					capturer.capture( canvas );
					globalCounter = nTimes;
					finalFrameRecaptured = true;
					return;
				}
				
				renderScene();
				stats.update();

				if (globalCounter >= nTimes)
				{
					capturer.stop();
					capturer.save();
					captureFinished = true;
				}		
			}

			function takeScreenshot( imgNumber ) {
				//
				// Make sure that pop-ups are allowed from this site
				//
				
			    // For screenshots to work with WebGL renderer, preserveDrawingBuffer should be set to true.
			    // open in new window like this
					var w = window.open('', '');
	    			w.document.title = "Screenshot";
	    			//w.document.body.style.backgroundColor = "red";
	    			var img = new Image();
	    			img.src = renderer.domElement.toDataURL();
	    			w.document.body.appendChild(img);

			    	// download file like this.
			    	var a = document.createElement('a');
				a.href = renderer.domElement.toDataURL().replace("image/png", "image/octet-stream");
			    a.download = imgCounter.toString().padStart(10, "0") + '.png'
				a.click();
				
				imgCounter = imgCounter + 1;
				
				w.close();
			}

			function renderScene() {

				renderer.render( scene, camera );

			}

			function getNodePosition( dataset, timeIndex, nodeIndex ) {
				var baseNum = timeIndex * 5 * dataset.nNodes;
				var nodeBase = baseNum + 5 * nodeIndex;

				return new THREE.Vector3(
					dataset.nodesRod[nodeBase + 2],
					dataset.nodesRod[nodeBase + 3],
					dataset.nodesRod[nodeBase + 4]
				);
			}

			function updateRobotGripper( dataset, timeIndex ) {
				if ( !showRobotGripper || !gripperGroup ) {
					return;
				}

				var movingEndIndex = dataset.nNodes - 1;
				var freeEnd = getNodePosition( dataset, timeIndex, movingEndIndex );
				var previousNode = getNodePosition( dataset, timeIndex, movingEndIndex - 1 );
				var tangent = freeEnd.clone().sub( previousNode ).normalize();
				var angle = Math.atan2( tangent.y, tangent.x ) + Math.PI;
				var fingertipOffset = new THREE.Vector3( 0.74, 0, 0 );
				fingertipOffset.applyAxisAngle( new THREE.Vector3( 0, 0, 1 ), angle );

				gripperGroup.position.copy( freeEnd ).sub( fingertipOffset );
				gripperGroup.rotation.set( 0, 0, angle );
			}

			function makeRodMaterial( color, opacity ) {
				return new THREE.MeshPhongMaterial( {
					color: color,
					transparent: opacity < 1.0,
					opacity: opacity,
					depthWrite: opacity >= 1.0,
					shininess: 150,
					specular: 0x222222
				} );
			}

			function addCylinderSegment( startPoint, endPoint, radius, material, rodStyle ) {
				var segment = endPoint.clone().sub( startPoint );
				var length = segment.length();

				if ( length < 1e-8 ) {
					return;
				}

				var geometry = new THREE.CylinderGeometry( radius, radius, length, 12, 1, false );
				var cylinder = new THREE.Mesh( geometry, material );

				cylinder.position.copy( startPoint ).add( endPoint ).multiplyScalar( 0.5 );
				cylinder.quaternion.setFromUnitVectors(
					new THREE.Vector3( 0, 1, 0 ),
					segment.normalize()
				);
				cylinder.castShadow = rodStyle.opacity >= 1.0;
				cylinder.receiveShadow = true;
				cylinder.renderOrder = rodStyle.renderOrder;

				rodGroup.add( cylinder );
			}

			function addRodToGroup( rodStyle, timeIndex ) {
				var dataset = rodStyle.data;
				var radius = dataset.rodRadius * rodStyle.radiusScale;
				var pathPoints = [];

				for (let j = 0; j < dataset.nNodes; j++) {
					pathPoints.push( getNodePosition( dataset, timeIndex, j ) );
				}

				var material = makeRodMaterial( rodStyle.color, rodStyle.opacity );

				for (let j = 0; j < pathPoints.length - 1; j++) {
					addCylinderSegment( pathPoints[j], pathPoints[j + 1], radius, material, rodStyle );
				}

				var sphereColor = new THREE.Color( rodStyle.color ).multiplyScalar( 0.65 );
				var sphereMaterial = makeRodMaterial( sphereColor, rodStyle.opacity );
				var sphereRadius = rodDataGroundTruth.rodRadius * 2;
				var sphereGeom = new THREE.SphereGeometry( sphereRadius, 32, 32 );

				for (let j = 0; j < pathPoints.length; j++) {
					let nodePosition = pathPoints[j];
					let sphere = new THREE.Mesh( sphereGeom, sphereMaterial );

					sphere.position.copy( nodePosition );
					sphere.castShadow = rodStyle.opacity >= 1.0;
					sphere.receiveShadow = true;
					sphere.renderOrder = rodStyle.renderOrder;

					rodGroup.add( sphere );
				}
			}

			function render() {
                const delta = clock.getDelta();

                if (globalCounter >= nTimes) {
                    renderScene();
                    return;
                }

                if (globalCounter <= nTimes-1)
                    scene.remove(rodGroup);

                rodGroup = new THREE.Group();
                updateRobotGripper( rodDataGroundTruth, globalCounter );

                for (let i = 0; i < rodDataSets.length; i++) {
                    addRodToGroup( rodDataSets[i], globalCounter );
                }

                scene.add( rodGroup );
                renderScene();
            }


		</script>
		</div>
	</body>
</html>
