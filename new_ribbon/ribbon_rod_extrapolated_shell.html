<!DOCTYPE html>
<html lang="en">
  <head>
    <title>three.js — Shell + Rod (with m1 arrows) in same scene</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <style>
      body {
        font-family: Monospace;
        background-color: #000;
        color: #fff;
        margin: 0px;
        overflow: hidden;
      }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        z-index: 100;
        display: block;
      }
      #info a {
        color: #f00;
        font-weight: bold;
        text-decoration: underline;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <canvas
      id="myCanvas"
      style="font-family: Monospace; background-color: #000; color: #fff; margin: 0px; overflow: hidden;"
    ></canvas>

    <script src="../js/build/three.js"></script>
    <script src="../js/examples/js/controls/OrbitControls.js"></script>
    <script src="../js/examples/js/shaders/UnpackDepthRGBAShader.js"></script>
    <script src="../js/examples/js/utils/ShadowMapViewer.js"></script>
    <script src="../js/examples/js/WebGL.js"></script>
    <script src="../js/examples/js/libs/stats.min.js"></script>

    <script src="../ccapture.js-master/build/CCapture.all.min.js"></script>

    <!-- MUST define: var nTri = ...; var nodes = [...]; -->
    <script src="shellData.js"></script>

    <!-- MUST define: var nNodes = ...; var nodesRod = [...]; var rodRadius = ...; (optional) var m1Rod = [...]; -->
    <script src="rodData.js"></script>

    <script>
      var camera, scene, renderer, clock, stats;
      var spotLight;

      // Shell data
      var nTri, nodes;
      var triGroup;

      // Rod data
      var nNodes, nodesRod, rodRadius;
      var rodGroup;
      var renderNodes = 200;

      // m1 arrows
      var arrowLength = 1.0;

      // Timing / capture
      var globalCounter = 0;
      var nTimesShell = 0;
      var nTimesRod = 0;
      var nTimes = 0;

      // Create a capturer that exports PNG images in a TAR file
      var capturer = new CCapture({ format: "png" });
      var canvas = document.getElementById("myCanvas");

      init();
      animate();

      function init() {
        // pull globals explicitly (so it’s obvious what must exist)
        nTri = window.nTri;
        nodes = window.nodes;

        nNodes = window.nNodes;
        nodesRod = window.nodesRod;
        rodRadius = window.rodRadius;

        if (typeof nTri === "undefined" || typeof nodes === "undefined") {
          console.error(
            "shellData.js must define global variables: nTri, nodes"
          );
        }
        if (typeof nNodes === "undefined" || typeof nodesRod === "undefined") {
          console.error(
            "rodData.js must define global variables: nNodes, nodesRod (and optionally rodRadius, m1Rod)"
          );
        }
        if (typeof rodRadius === "undefined" || rodRadius === null) {
          rodRadius = 0.2; // fallback
        }

        initScene();
        initMisc();

        document.body.appendChild(renderer.domElement);
        window.addEventListener("resize", onWindowResize, false);

        // frame counts
        // shell: per frame you have nTri triangles, each triangle has 9 entries
        nTimesShell = nodes.length / (9 * nTri);

        // rod: per frame you have nNodes nodes, each node has 5 entries
        nTimesRod = nodesRod.length / (5 * nNodes);

        // Use the common duration so both animate together
        nTimes = Math.min(nTimesShell, nTimesRod);

        // arrow size relative to rod thickness
        arrowLength = 6.0 * rodRadius;

        // sanity prints
        console.log("nTimesShell =", nTimesShell, "nTimesRod =", nTimesRod, "nTimes =", nTimes);
        if (typeof m1Rod === "undefined") {
          console.warn("m1Rod undefined in rodData.js: m1 arrows will NOT render.");
        } else {
          var expected = nTimesRod * (nNodes - 1) * 3;
          if (m1Rod.length !== expected) {
            console.warn(
              "m1Rod length mismatch. Expected " +
                expected +
                " but got " +
                m1Rod.length +
                ". Expected packing: per frame, (nNodes-1) edges, 3 values each."
            );
          }
        }
      }

      function initScene() {
        // Use your shell camera (working for you)
        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          1,
          3000
        );
        camera.up = new THREE.Vector3(0, 0, 1);
        camera.position.set(10, 7, 3);

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        // Lights
        scene.add(new THREE.AmbientLight(0x808080));

        spotLight = new THREE.SpotLight(0x9090b0);
        spotLight.name = "Spot Light";
        spotLight.angle = 0.9;
        spotLight.penumbra = 0.5;
        spotLight.position.set(50, 50, 200);
        spotLight.castShadow = true;
        spotLight.shadow.camera.near = 50;
        spotLight.shadow.camera.far = 350;
        spotLight.intensity = 1;
        spotLight.shadow.mapSize.width = 1024;
        spotLight.shadow.mapSize.height = 1024;
        scene.add(spotLight);

        // Ground (your shell ground)
        var groundgeometry = new THREE.BoxGeometry(1000, 1000.0, 1.0);
        var groundmaterial = new THREE.MeshPhongMaterial({
          color: 0xd6f5ff,
          shininess: 0,
          specular: 0x000000,
        });

        // IMPORTANT: Mesh() takes (geometry, material) — keep it standard.
        var ground = new THREE.Mesh(groundgeometry, groundmaterial);
        ground.scale.multiplyScalar(1);
        ground.position.set(-100, -35, -10);
        ground.castShadow = false;
        ground.receiveShadow = true;
        scene.add(ground);

        // init groups
        triGroup = new THREE.Group();
        rodGroup = new THREE.Group();
        scene.add(triGroup);
        scene.add(rodGroup);
      }

      function initMisc() {
        renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: true,
          preserveDrawingBuffer: true,
        });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        var controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(8, 2, 0);
        controls.update();

        clock = new THREE.Clock();

        stats = new Stats();
        document.body.appendChild(stats.dom);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        // Capture start
        if (globalCounter === 0) {
          capturer.start(canvas);
        }

        requestAnimationFrame(animate);

        render();
        stats.update();

        // Capture
        if (globalCounter <= nTimes) {
          capturer.capture(canvas);
        }

        // Stop
        if (globalCounter === nTimes + 1) {
          capturer.stop();
          capturer.save();
        }
      }

      function renderScene() {
        renderer.render(scene, camera);
      }

      // -----------------------------
      // Rod helpers (same as your rod file)
      // -----------------------------
      function getNodePos(frameIdx, nodeIdx) {
        var base = frameIdx * 5 * nNodes + 5 * nodeIdx;
        return new THREE.Vector3(
          nodesRod[base + 2],
          nodesRod[base + 3],
          nodesRod[base + 4]
        );
      }

      function getM1(frameIdx, edgeIdx) {
        var base = frameIdx * (nNodes - 1) * 3 + 3 * edgeIdx;
        return new THREE.Vector3(
          m1Rod[base + 0],
          m1Rod[base + 1],
          m1Rod[base + 2]
        );
      }

      function addM1ArrowsToGroup(frameIdx, group) {
        if (typeof m1Rod === "undefined") return;

        var nEdges = nNodes - 1;
        for (var e = 0; e < nEdges; e++) {
          var p0 = getNodePos(frameIdx, e);
          var p1 = getNodePos(frameIdx, e + 1);

          var origin = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);

          var dir = getM1(frameIdx, e);
          if (dir.lengthSq() < 1e-14) continue;
          dir.normalize();

          var L = arrowLength;
          var headL = 0.25 * L;
          var headW = 0.15 * L;

          var arrow = new THREE.ArrowHelper(dir, origin, L, 0xff0000, headL, headW);
          group.add(arrow);
        }
      }

      // -----------------------------
      // Update Shell (your working shell logic)
      // -----------------------------
      function updateShell(frameIdx) {
        // remove previous shell
        scene.remove(triGroup);
        triGroup = new THREE.Group();

        var material = new THREE.MeshPhongMaterial({
          color: 0xa4653a,
          shininess: 150,
          specular: 0x222222,
		  transparent: true,
		  opacity: 0.5
        });

        var startNum = frameIdx * nTri;
        var endNum = frameIdx * nTri + nTri;

        for (var i = startNum + 1; i <= endNum; i++) {
          var geom = new THREE.Geometry();
          var v1 = new THREE.Vector3(
            nodes[9 * (i - 1) + 0],
            nodes[9 * (i - 1) + 1],
            nodes[9 * (i - 1) + 2]
          );
          var v2 = new THREE.Vector3(
            nodes[9 * (i - 1) + 3],
            nodes[9 * (i - 1) + 4],
            nodes[9 * (i - 1) + 5]
          );
          var v3 = new THREE.Vector3(
            nodes[9 * (i - 1) + 6],
            nodes[9 * (i - 1) + 7],
            nodes[9 * (i - 1) + 8]
          );

          // first face
          var triangle = new THREE.Triangle(v1, v2, v3);
          var normal = new THREE.Vector3();
          triangle.getNormal(normal);
          geom.vertices.push(triangle.a, triangle.b, triangle.c);
          geom.faces.push(new THREE.Face3(0, 1, 2, normal));

          var mesh = new THREE.Mesh(geom, material);
          mesh.castShadow = true;
          mesh.receiveShadow = false;
          triGroup.add(mesh);

          // second face
          var geom2 = new THREE.Geometry();
          var triangle2 = new THREE.Triangle(v1, v3, v2);
          var normal2 = new THREE.Vector3();
          triangle2.getNormal(normal2);
          geom2.vertices.push(triangle2.a, triangle2.b, triangle2.c);
          geom2.faces.push(new THREE.Face3(0, 1, 2, normal2));

          var mesh2 = new THREE.Mesh(geom2, material);
          mesh2.castShadow = true;
          mesh2.receiveShadow = false;
          triGroup.add(mesh2);
        }

        scene.add(triGroup);
      }

      // -----------------------------
      // Update Rod (TubeGeometry + optional m1 arrows)
      // -----------------------------
      function updateRod(frameIdx) {
        // remove previous rod
        scene.remove(rodGroup);
        rodGroup = new THREE.Group();

        // Capture frameIdx safely for the curve
        function CustomSinCurve(scale) {
          THREE.Curve.call(this);
          this.scale = scale === undefined ? 1 : scale;
        }
        CustomSinCurve.prototype = Object.create(THREE.Curve.prototype);
        CustomSinCurve.prototype.constructor = CustomSinCurve;

        CustomSinCurve.prototype.getPoint = function (t) {
          var baseNum = frameIdx * 5 * nNodes;
          if (baseNum > nodesRod.length) return new THREE.Vector3(0, 0, 0);

          var indRight = t * (nNodes - 1);
          var indf = Math.floor(indRight);
          var indc = Math.ceil(indRight);
          var df = indRight - indf;
          var dc = -indRight + indc;

          if (df < 1 / (100 * renderNodes)) {
            df = 1.0;
            dc = 0.0;
          }

          var tx =
            nodesRod[5 * indf + 2 + baseNum] * dc +
            nodesRod[5 * indc + 2 + baseNum] * df;
          var ty =
            nodesRod[5 * indf + 3 + baseNum] * dc +
            nodesRod[5 * indc + 3 + baseNum] * df;
          var tz =
            nodesRod[5 * indf + 4 + baseNum] * dc +
            nodesRod[5 * indc + 4 + baseNum] * df;

          return new THREE.Vector3(tx, ty, tz).multiplyScalar(this.scale);
        };

        var path = new CustomSinCurve(1);

        // TubeGeometry(path, tubularSegments, radius, radialSegments, closed)
        var geometry = new THREE.TubeGeometry(path, 200, rodRadius, 12, false);

        var material = new THREE.MeshPhongMaterial({
          color: 0xa4653a,
          shininess: 150,
          specular: 0x222222,
        });

        var rod = new THREE.Mesh(geometry, material);
        rod.castShadow = true;
        rod.receiveShadow = true;
        rodGroup.add(rod);

        // m1 arrows (optional)
        addM1ArrowsToGroup(frameIdx, rodGroup);

        scene.add(rodGroup);
      }

      function render() {
        var delta = clock.getDelta();

        // Keep your original order (works for you):
        // render current scene first, then update geometry for next frame
        renderScene();

        if (globalCounter >= nTimes) {
          globalCounter = globalCounter + 1;
          return;
        }

        // Update BOTH shell + rod using SAME frame index
        updateShell(globalCounter);
        updateRod(globalCounter);

        globalCounter = globalCounter + 1;
      }
    </script>
  </body>
</html>
