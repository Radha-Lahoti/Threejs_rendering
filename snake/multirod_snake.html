<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Two snake rods (ref vs obtained)</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <style>
      body {
        font-family: Monospace;
        background-color: #000;
        color: #000;
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <canvas
      id="myCanvas"
      style="
        font-family: Monospace;
        background-color: #fff;
        color: #000;
        margin: 0;
        overflow: hidden;
      "
    ></canvas>

    <!-- three.js and helpers -->
    <script src="../js/build/three.js"></script>
    <script src="../js/examples/js/controls/OrbitControls.js"></script>
    <script src="../js/examples/js/libs/stats.min.js"></script>

    <!-- CCapture -->
    <script src="../ccapture.js-master/build/CCapture.all.min.js"></script>

    <!-- Rod data (edit these files to export *_ref and *_obt variables) -->
    <script src="rodData_snake_ref.js"></script>
    <script src="rodData_snake_obtained.js"></script>

    <script>
      // EXPECTED from data files:
      // rodData_snake_ref.js:    nodesRod_ref, nNodes_ref, rodRadius_ref
      // rodData_snake_obtained.js: nodesRod_obt, nNodes_obt, rodRadius_obt
      //
      // Each nodesRod_*: [time, ?, x, y, z] per node -> 5 entries per node, flattened over time.

      var camera, scene, renderer, clock, stats;
      var ambientLight;
      var rodGroup;
      var globalCounter = 0;
      var nTimes_ref, nTimes_obt, nTimes;
      var hasSaved = false;

      var canvas = document.getElementById("myCanvas");

      // CCapture setup
      var capturer = new CCapture({
        format: "png",
        framerate: 60,
        verbose: true,
      });

      init();
      animate();

      function init() {
        initScene();
        initMisc();

        document.body.appendChild(renderer.domElement);
        window.addEventListener("resize", onWindowResize, false);

        // Compute number of timesteps for each rod and use the minimum
        nTimes_ref = nodesRod_ref.length / (5 * nNodes_ref);
        nTimes_obt = nodesRod_obt.length / (5 * nNodes_obt);
        nTimes = Math.min(nTimes_ref, nTimes_obt);
        console.log("nTimes_ref =", nTimes_ref, "nTimes_obt =", nTimes_obt, "using =", nTimes);

        // Start CCapture after everything is ready
        capturer.start();
        console.log("CCapture started");
      }

      function initScene() {
        // Top-ish view with some 3D feel
        camera = new THREE.PerspectiveCamera(
          20,
          window.innerWidth / window.innerHeight,
          1,
          1000
        );
        camera.position.set(0, 5, 5);
        camera.up.set(0, 1, 0);
        camera.lookAt(0, 0, 0);

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // pure white background

        // Simple ambient light (no shadows, no speculars)
        ambientLight = new THREE.AmbientLight(0x888888);
        scene.add(ambientLight);

        // Optional soft directional light for some shading (no shadows)
        var dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(30, -30, 50);
        dirLight.castShadow = false;
        scene.add(dirLight);

        // Ground (matte white)
        var groundgeometry = new THREE.BoxGeometry(500, 500.0, 1.0);
        var groundmaterial = new THREE.MeshLambertMaterial({
          color: 0xffffff,
        });
        var ground = new THREE.Mesh(groundgeometry, groundmaterial);
        ground.position.set(-100, -35, -3.5);
        ground.receiveShadow = false;
        scene.add(ground);

        rodGroup = new THREE.Group();
        scene.add(rodGroup);
      }

      function initMisc() {
        renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: true,
          preserveDrawingBuffer: true, // needed for CCapture
        });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false; // no shadows

        var controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.update();

        clock = new THREE.Clock();

        stats = new Stats();
        document.body.appendChild(stats.dom);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);

        renderFrame();
        stats.update();

        // Capture frames until we've exhausted time steps
        if (!hasSaved) {
          if (globalCounter < nTimes) {
            capturer.capture(renderer.domElement);
          } else {
            console.log("Stopping capture and saving...");
            capturer.stop();
            capturer.save();
            hasSaved = true;
          }
        }
      }

      function renderScene() {
        renderer.render(scene, camera);
      }

      function renderFrame() {
        var delta = clock.getDelta();

        // If we've finished all timesteps, just keep rendering the last frame
        if (globalCounter >= nTimes) {
          renderScene();
          return;
        }

        // Clear previous rods
        while (rodGroup.children.length > 0) {
          rodGroup.remove(rodGroup.children[0]);
        }

        // --- Obtained rod ---
        var rod_obt = buildRodAtTime(
          nodesRod_obt,
          nNodes_obt,
          rodRadius_obt,
          globalCounter,
          // cyan for obtained
          0x0072BD,
          1 // opacity
        );
        
        // --- Reference rod ---
        var rod_ref = buildRodAtTime(
          nodesRod_ref,
          nNodes_ref,
          rodRadius_ref,
          globalCounter,
          0xD95319, // orange for reference
          1 // opacity
        );
        

        if (rod_ref) rodGroup.add(rod_ref);
        if (rod_obt) rodGroup.add(rod_obt);

        globalCounter += 1;

        renderScene();
      }

      // Build a single rod mesh for a given time index from flattened nodes array
      function buildRodAtTime(nodesArray, nNodes, rodRadius, tIndex, color, opacity) {
        var baseNum = tIndex * 5 * nNodes;
        if (baseNum + 5 * (nNodes - 1) + 4 >= nodesArray.length) {
          return null; // out of range safeguard
        }

        var points = [];
        for (var j = 0; j < nNodes; j++) {
          var idx = baseNum + 5 * j;
          var tx = nodesArray[idx + 2];
          var ty = nodesArray[idx + 3];
          var tz = nodesArray[idx + 4];
          points.push(new THREE.Vector3(tx, ty, tz));
        }

        var path = new THREE.CatmullRomCurve3(points);
        var geometry = new THREE.TubeGeometry(path, 200, rodRadius, 12, false);

        var material = new THREE.MeshPhongMaterial({
            color: color,
            transparent: true,
            opacity: opacity,
            shininess: 150,
            specular: 0x222222,
        });


        var rod = new THREE.Mesh(geometry, material);
        rod.castShadow = true;
        rod.receiveShadow = true;

        return rod;
      }
    </script>
  </body>
</html>
